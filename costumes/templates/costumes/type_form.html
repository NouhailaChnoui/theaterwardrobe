{% extends 'base.html' %}
{% block title %}{{ titre }} — TheaterWardrobe{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <div class="d-flex align-items-center mb-4 gap-3">
            <a href="{% url 'type_liste' %}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left"></i></a>
            <h2 class="mb-0">{{ titre }}</h2>
        </div>
        <div class="card"><div class="card-body p-4">
            <form method="post">{% csrf_token %}
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors.0 }}</div>{% endif %}
                </div>
                {% endfor %}
                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn flex-fill" style="background:#6d0d23;color:white;">Enregistrer</button>
                    <a href="{% url 'type_liste' %}" class="btn btn-outline-secondary flex-fill">Annuler</a>
                </div>
            </form>
        </div></div>
    </div>
</div>
{% endblock %}
